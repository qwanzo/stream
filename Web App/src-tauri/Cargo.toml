[package]
name = "pansilu-stream"
version = "1.0.0"
description = "Pansilu Stream Tauri Desktop App"
authors = ["Pansilu"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
