<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="plixShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E50914" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <g filter="url(#plixShadow)">
    <text x="256" y="278" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="156" font-weight="900" letter-spacing="10" fill="#F5F5F5" stroke="#E50914" stroke-width="5" paint-order="stroke" >PLIX</text>
  </g>
