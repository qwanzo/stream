<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0506" />
      <stop offset="50%" stop-color="#0f0f10" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#E50914" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#331012" stroke-width="4" />
  
  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#redGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="12 12" />

  <!-- Stylized "P" Emblem & Play Button -->
  <g filter="url(#subtleShadow)">
    <!-- Play Triangle Shield background -->
    <path d="M 170 120 L 370 256 L 170 392 Z" fill="url(#redGrad)" rx="16" />
    
    <!-- Inner cut/accent shaping the 'P' inside Play triangle -->
    <path d="M 210 170 L 290 220 C 315 235 315 277 290 292 L 210 342" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <circle cx="210" cy="256" r="18" fill="url(#goldGrad)" />
  </g>

  <!-- Pulsing Live Dot -->
  <circle cx="410" cy="110" r="14" fill="#10B981" filter="url(#glow)" />
  <circle cx="410" cy="110" r="22" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6" />
</svg>
