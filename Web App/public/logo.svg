<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="cineRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>
    <filter id="cineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#E50914" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <g filter="url(#cineShadow)">
    <text x="256" y="270" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="132" font-weight="900" letter-spacing="4" fill="#F5F5F5" stroke="#E50914" stroke-width="5" paint-order="stroke">CINE</text>
    <text x="256" y="360" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="112" font-weight="900" letter-spacing="4" fill="url(#cineRed)" stroke="#F5F5F5" stroke-width="3" paint-order="stroke">VAULT</text>
  </g>

</svg>
