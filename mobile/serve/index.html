<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>streamsilu - Download App</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div id="root"></div>

    <script type="text/babel">
        const App = () => {
            const appInfo = {
                name: "streamsilu",
                version: "1.0.0 (Debug)",
                size: "Calculating...",
                filename: "streamsilu.apk"
            };

            return (
                <div class="max-w-md w-full p-8 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 text-center animate-in fade-in zoom-in duration-500">
                    <div class="mb-6 flex justify-center">
                        <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                        </div>
                    </div>

                    <h1 class="text-3xl font-bold mb-2">{appInfo.name}</h1>
                    <p class="text-gray-400 mb-6">Download the latest Android build to your device.</p>

                    <div class="bg-gray-900/50 rounded-lg p-4 mb-8 text-left space-y-2 border border-gray-700">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Version</span>
                            <span class="font-medium text-gray-300">{appInfo.version}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Platform</span>
                            <span class="font-medium text-gray-300">Android (APK)</span>
                        </div>
                    </div>

                    <a
                        href={appInfo.filename}
                        download
                        class="block w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 active:transform active:scale-95 transition-all rounded-xl font-bold text-lg shadow-lg shadow-blue-600/30"
                    >
                        Download APK
                    </a>

                    <p class="mt-6 text-xs text-gray-500 uppercase tracking-widest font-semibold">
                        streamsilu Mobile
                    </p>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
