name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build release APK
        working-directory: mobile
        run: ./android/gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mobile/android/app/build/outputs/apk/release/app-release.apk --title "Pansilu Stream $GITHUB_REF_NAME" --generate-notes
