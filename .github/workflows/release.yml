name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pansilu-stream-linux
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pansilu-stream-macos
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pansilu-stream-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Web App/package-lock.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install desktop dependencies
        working-directory: "Web App"
        run: npm ci

      - name: Generate required app bundle icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow
          python - <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          from PIL import Image, ImageOps

          icon_dir = Path('Web App/src-tauri/icons')
          icon_dir.mkdir(parents=True, exist_ok=True)
          source = icon_dir / 'icon.png'

          if not source.exists():
              raise FileNotFoundError(f'Missing source icon: {source}')

          img = Image.open(source).convert('RGBA')
          square = ImageOps.fit(img, (1024, 1024), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          square.save(source, format='PNG')

          ico_path = icon_dir / 'icon.ico'
          square.save(ico_path, format='ICO', sizes=[(16, 16), (32, 32), (64, 64), (128, 128), (256, 256), (512, 512)])

          if sys.platform == 'darwin':
              iconset_dir = icon_dir / 'icon.iconset'
              if iconset_dir.exists():
                  shutil.rmtree(iconset_dir)
              iconset_dir.mkdir(parents=True, exist_ok=True)

              sizes = [16, 32, 128, 256, 512, 1024]
              for size in sizes:
                  resized = ImageOps.fit(square, (size, size), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  resized.save(iconset_dir / f'icon_{size}x{size}.png')
                  if size in (16, 32, 128, 256, 512):
                      resized.save(iconset_dir / f'icon_{size}x{size}@2x.png')

              subprocess.run(['iconutil', '-c', 'icns', str(iconset_dir), '-o', str(icon_dir / 'icon.icns')], check=True)

          icns_path = icon_dir / 'icon.icns'
          if icns_path.exists() and sys.platform != 'darwin':
              icns_path.unlink()

          required = ['icon.png', 'icon.ico']
          if sys.platform == 'darwin':
              required.append('icon.icns')
          missing = [str(icon_dir / name) for name in required if not (icon_dir / name).exists()]
          if missing:
              raise FileNotFoundError(f'Missing generated icon files: {missing}')
          PY

      - name: Install Tauri CLI
        working-directory: "Web App"
        run: npm install @tauri-apps/cli@2 --no-save

      - name: Build desktop app
        working-directory: "Web App"
        run: npm run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            Web App/src-tauri/target/release/bundle/**/*

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pansilu-stream-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Rename artifacts to versioned release filenames
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_no_v="${VERSION#v}"
          mkdir -p release-files

          handle_file() {
            local src="$1"
            local target="$2"
            cp "$src" "release-files/$target"
          }

          for artifact_dir in artifacts/*; do
            [[ -d "$artifact_dir" ]] || continue
            for file in "$artifact_dir"/*; do
              [[ -f "$file" ]] || continue
              name="${file##*/}"
              lower="${name,,}"

              case "$artifact_dir" in
                *linux*)
                  if [[ "$lower" == *.appimage ]]; then
                    handle_file "$file" "pansilu-stream-linux-${version_no_v}.AppImage"
                  elif [[ "$lower" == *.deb ]]; then
                    handle_file "$file" "pansilu-stream-linux-${version_no_v}.deb"
                  elif [[ "$lower" == *.rpm ]]; then
                    handle_file "$file" "pansilu-stream-linux-${version_no_v}.rpm"
                  fi
                  ;;
                *macos*)
                  if [[ "$lower" == *.dmg ]]; then
                    handle_file "$file" "pansilu-stream-macos-${version_no_v}.dmg"
                  elif [[ "$lower" == *.tar.gz || "$lower" == *.tgz ]]; then
                    handle_file "$file" "pansilu-stream-macos-${version_no_v}.tar.gz"
                  elif [[ "$lower" == *.app ]]; then
                    handle_file "$file" "pansilu-stream-macos-${version_no_v}.app"
                  fi
                  ;;
                *windows*)
                  if [[ "$lower" == *.msi ]]; then
                    handle_file "$file" "pansilu-stream-windows-${version_no_v}.msi"
                  elif [[ "$lower" == *.zip ]]; then
                    handle_file "$file" "pansilu-stream-windows-${version_no_v}.zip"
                  elif [[ "$lower" == *.exe ]]; then
                    handle_file "$file" "pansilu-stream-windows-${version_no_v}.exe"
                  fi
                  ;;
                *android*)
                  if [[ "$lower" == *.apk ]]; then
                    handle_file "$file" "pansilu-stream-android-${version_no_v}.apk"
                  fi
                  ;;
              esac
            done
          done

          find release-files -maxdepth 1 -type f | sort

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Pansilu Stream $GITHUB_REF_NAME" --generate-notes
          fi
          find release-files -type f -exec gh release upload "$GITHUB_REF_NAME" {} --clobber +
